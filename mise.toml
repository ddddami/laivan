[alias]
sqlc = "aqua:sqlc-dev/sqlc"
goose = "github:pressly/goose"

[tools]
go = "1.25.7"
node = "24"
pnpm = "10.22.0"
golangci-lint = "v2.8.0"
sqlc = "1.31.1"
goose = "v3.27.1"
air = "v1.65.3"

[env]
_.file = ".env"

[tasks]

[tasks."api:dev"]
description = "Run the API server with hot reload"
dir = "api"
run = "air"

[tasks."api:dev:mobile"]
description = "Run the API for mobile LAN preview"
dir = "api"
run = "LAIVAN_IMGPROXY_BASE_URL=/__imgproxy air"

[tasks."api:test"]
description = "Run API tests"
dir = "api"
run = "go test ./..."

[tasks."api:test:integration"]
description = "Run API integration tests against local test database"
depends = ["db:test:reset"]
dir = "api"
run = "go test -tags=integration ./..."

[tasks."api:fmt"]
description = "Format API Go code"
dir = "api"
run = "gofmt -w ./cmd ./internal"

[tasks."api:fmt:check"]
description = "Check API Go formatting without mutating files"
dir = "api"
run = '''
unformatted="$(gofmt -l ./cmd ./internal)"
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
'''

[tasks."api:tidy"]
description = "Tidy API Go modules"
dir = "api"
run = "go mod tidy"

[tasks."api:tidy:check"]
description = "Check API Go modules are tidy"
dir = "api"
run = '''
go mod tidy
git diff --exit-code -- go.mod go.sum
'''

[tasks."api:lint"]
description = "Run golangci-lint on API code"
dir = "api"
run = "golangci-lint run --timeout=5m --config=../.golangci.yml"

[tasks."api:check"]
description = "Run API formatting, module tidy, lint, and tests"
run = '''
mise run "api:fmt" &&
mise run "api:tidy" &&
mise run "api:lint" &&
mise run "api:test"
'''

[tasks."api:verify"]
description = "Run all non-mutating API checks (matches CI)"
run = '''
mise run "api:fmt:check" &&
mise run "api:tidy:check" &&
mise run "api:lint" &&
mise run "api:test"
'''

[tasks."infra:up"]
description = "Start local infra services"
run = "docker compose up -d"

[tasks."infra:down"]
description = "Stop local infra services"
run = "docker compose down"

[tasks."infra:ps"]
description = "Show local infra service status"
run = "docker compose ps"

[tasks."infra:logs"]
description = "Show local infra logs"
run = "docker compose logs -f"

[tasks."db:status"]
description = "Show local database migration status"
run = ''': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir api/migrations postgres "$LAIVAN_DB_URL" status'''

[tasks."db:up"]
description = "Run local database migrations"
run = ''': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir api/migrations postgres "$LAIVAN_DB_URL" up'''

[tasks."db:down"]
description = "Roll back the latest local database migration"
run = ''': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir api/migrations postgres "$LAIVAN_DB_URL" down'''

[tasks."db:reset"]
description = "Roll local database all the way down then up"
run = ''': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir api/migrations postgres "$LAIVAN_DB_URL" reset'''

[tasks."db:seed:dev"]
description = "Seed local database with deterministic dev marketplace data"
dir = "api"
run = ''': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && go run ./cmd/seed'''

[tasks."db:test:reset"]
description = "Reset local test database migrations"
hide = true
run = ''': "${LAIVAN_TEST_DB_URL:?LAIVAN_TEST_DB_URL is required}" && goose -dir api/migrations postgres "$LAIVAN_TEST_DB_URL" up && goose -dir api/migrations postgres "$LAIVAN_TEST_DB_URL" reset && goose -dir api/migrations postgres "$LAIVAN_TEST_DB_URL" up'''

[tasks."sqlc:generate"]
description = "Generate sqlc database code"
dir = "api"
run = "sqlc generate"

[tasks."sqlc:check"]
description = "Check sqlc generated code has no drift"
dir = "api"
run = '''
sqlc generate
git diff --exit-code -- internal/db/generated
'''

[tasks."api:docs:validate"]
description = "Validate the OpenAPI contract"
run = "pnpm --package=@redocly/cli@2.31.4 dlx redocly lint openapi/openapi.yaml"

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "pnpm install"

[tasks."web:dev"]
description = "Run the web dev server"
dir = "web"
run = "pnpm dev"

[tasks."web:dev:mobile"]
description = "Expose the web dev server on the local network"
dir = "web"
run = "pnpm dev --host 0.0.0.0"

[tasks."web:test"]
description = "Run web tests"
dir = "web"
run = "pnpm test"

[tasks."web:lint"]
description = "Lint the web app"
dir = "web"
run = "pnpm lint"

[tasks."web:fmt"]
description = "Format the web app"
dir = "web"
run = "pnpm fmt"

[tasks."web:typecheck"]
description = "Typecheck the web app"
dir = "web"
run = "pnpm typecheck"

[tasks."web:check"]
description = "Run web formatting, linting, tests, and build"
dir = "web"
run = "pnpm check"

[tasks."web:build"]
description = "Build the web app"
dir = "web"
run = "pnpm build"

[tasks.test]
description = "Run backend and frontend tests"
run = '''
mise run api:test &&
mise run web:test
'''
