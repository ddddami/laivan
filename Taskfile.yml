version: "3"

vars:
  API_DIR: api
  WEB_DIR: web

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  api:dev:
    desc: Run the API server
    dir: "{{.API_DIR}}"
    cmds:
      - air

  api:test:
    desc: Run API tests
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./...

  api:test:integration:
    desc: Run API integration tests against local test database
    deps:
      - db:test:reset
    dir: "{{.API_DIR}}"
    cmds:
      - go test -tags=integration ./...

  api:fmt:
    desc: Format API Go code
    dir: "{{.API_DIR}}"
    cmds:
      - gofmt -w ./cmd ./internal

  api:fmt:check:
    desc: Check API Go formatting without mutating files
    dir: "{{.API_DIR}}"
    cmds:
      - |
        unformatted="$(gofmt -l ./cmd ./internal)"
        if [ -n "$unformatted" ]; then
          printf '%s\n' "$unformatted"
          exit 1
        fi

  api:tidy:
    desc: Tidy API Go modules
    dir: "{{.API_DIR}}"
    cmds:
      - go mod tidy

  api:tidy:check:
    desc: Check API Go modules are tidy
    dir: "{{.API_DIR}}"
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  api:lint:
    desc: Run golangci-lint on API code
    dir: "{{.API_DIR}}"
    cmds:
      - golangci-lint run --timeout=5m --config=../.golangci.yml

  api:check:
    desc: Run API formatting, module tidy, lint, and tests
    cmds:
      - task: api:fmt
      - task: api:tidy
      - task: api:lint
      - task: api:test

  api:verify:
    desc: Run all non-mutating API checks (matches CI)
    cmds:
      - task: api:fmt:check
      - task: api:tidy:check
      - task: api:lint
      - task: api:test

  infra:up:
    desc: Start local infra services
    cmds:
      - docker compose up -d

  infra:down:
    desc: Stop local infra services
    cmds:
      - docker compose down

  infra:ps:
    desc: Show local infra service status
    cmds:
      - docker compose ps

  infra:logs:
    desc: Show local infra logs
    cmds:
      - docker compose logs -f

  db:status:
    desc: Show local database migration status
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" status'

  db:up:
    desc: Run local database migrations
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" up'

  db:down:
    desc: Roll back the latest local database migration
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" down'

  db:reset:
    desc: Roll local database all the way down then up
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" reset'

  db:seed:dev:
    desc: Seed local database with deterministic dev marketplace data
    dir: "{{.API_DIR}}"
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && go run ./cmd/seed'

  db:test:reset:
    internal: true
    desc: Reset local test database migrations
    cmds:
      - ': "${LAIVAN_TEST_DB_URL:?LAIVAN_TEST_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_TEST_DB_URL" up && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_TEST_DB_URL" reset && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_TEST_DB_URL" up'

  sqlc:generate:
    desc: Generate sqlc database code
    dir: "{{.API_DIR}}"
    cmds:
      - sqlc generate

  sqlc:check:
    desc: Check sqlc generated code has no drift
    dir: "{{.API_DIR}}"
    cmds:
      - sqlc generate
      - git diff --exit-code -- internal/db/generated

  api:docs:validate:
    desc: Validate the OpenAPI contract
    cmds:
      - pnpm --package=@redocly/cli@2.31.4 dlx redocly lint openapi/openapi.yaml

  web:install:
    desc: Install web dependencies
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm install

  web:dev:
    desc: Run the web dev server
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm dev

  web:test:
    desc: Run web tests
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm test

  web:lint:
    desc: Lint the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm lint

  web:fmt:
    desc: Format the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm fmt

  web:typecheck:
    desc: Typecheck the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm typecheck

  web:check:
    desc: Run web formatting, linting, tests, and build
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm check

  web:build:
    desc: Build the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm build

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: api:test
      - task: web:test
