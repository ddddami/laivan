version: "3"

vars:
  API_DIR: api
  WEB_DIR: web

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  api:dev:
    desc: Run the API server
    dir: "{{.API_DIR}}"
    cmds:
      - air

  api:test:
    desc: Run API tests
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./...

  api:test:integration:
    desc: Run API integration tests against local test database
    deps:
      - db:test:reset
    dir: "{{.API_DIR}}"
    cmds:
      - go test -tags=integration ./...

  api:fmt:
    desc: Format API Go code
    dir: "{{.API_DIR}}"
    cmds:
      - gofmt -w ./cmd ./internal

  api:tidy:
    desc: Tidy API Go modules
    dir: "{{.API_DIR}}"
    cmds:
      - go mod tidy

  api:check:
    desc: Run API formatting, module tidy, and tests
    cmds:
      - task: api:fmt
      - task: api:tidy
      - task: api:test

  infra:up:
    desc: Start local infra services
    cmds:
      - docker compose up -d

  infra:down:
    desc: Stop local infra services
    cmds:
      - docker compose down

  infra:ps:
    desc: Show local infra service status
    cmds:
      - docker compose ps

  infra:logs:
    desc: Show local infra logs
    cmds:
      - docker compose logs -f

  db:status:
    desc: Show local database migration status
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" status'

  db:up:
    desc: Run local database migrations
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" up'

  db:down:
    desc: Roll back the latest local database migration
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" down'

  db:reset:
    desc: Roll local database all the way down then up
    cmds:
      - ': "${LAIVAN_DB_URL:?LAIVAN_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_DB_URL" reset'

  db:test:reset:
    internal: true
    desc: Reset local test database migrations
    cmds:
      - ': "${LAIVAN_TEST_DB_URL:?LAIVAN_TEST_DB_URL is required}" && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_TEST_DB_URL" up && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_TEST_DB_URL" reset && goose -dir {{.API_DIR}}/migrations postgres "$LAIVAN_TEST_DB_URL" up'

  sqlc:generate:
    desc: Generate sqlc database code
    dir: "{{.API_DIR}}"
    cmds:
      - sqlc generate

  web:install:
    desc: Install web dependencies
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm install

  web:dev:
    desc: Run the web dev server
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm dev

  web:test:
    desc: Run web tests
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm test

  web:lint:
    desc: Lint the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm lint

  web:fmt:
    desc: Format the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm fmt

  web:typecheck:
    desc: Typecheck the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm typecheck

  web:check:
    desc: Run web formatting, linting, tests, and build
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm check

  web:build:
    desc: Build the web app
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm build

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: api:test
      - task: web:test
