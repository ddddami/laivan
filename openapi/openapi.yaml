        last_page:
          type: integer
        total_records:
          type: integer

    UnitTypeResponse:
      type: object
      required:
        - unit_type
      properties:
        unit_type:
          $ref: "#/components/schemas/UnitType"

    UnitTypesResponse:
      type: object
      required:
        - unit_types
      properties:
        unit_types:
          type: array
          items:
            $ref: "#/components/schemas/UnitType"

    AgentOfferResponse:
      type: object
      required:
        - agent_offer
      properties:
        agent_offer:
          $ref: "#/components/schemas/AgentOffer"

    AgentOffersResponse:
      type: object
      required:
        - agent_offers
      properties:
        agent_offers:
          type: array
          items:
            $ref: "#/components/schemas/AgentOffer"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - bad_request
            - validation_failed
            - not_found
            - method_not_allowed
            - internal_server_error
        message:
          type: string

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - fields
          properties:
            fields:
              type: object
              additionalProperties:
                type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ValidationError"
