openapi: 3.1.0
info:
  title: Laivan API
  version: 0.1.0
  summary: Backend API for Laivan's (campus-scoped) accommodation marketplace.
  description: >
    Laivan is a coordination, trust, and workflow layer for fragmented campus
    accommodation markets.


    This contract documents the currently implemented API surface. It should
    describe observable HTTP behavior, not internal Go package structure.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: API server
security: []
tags:
  - name: Health
    description: Service health checks.
  - name: Authentication
    description: Google sign-in and browser session management.
  - name: Campuses
    description: Public campus boundaries for marketplace discovery.
  - name: Discovery
    description: >-
      Searchable rentable opportunities combining property, unit type, and offer
      layers.
  - name: Properties
    description: Campus-scoped accommodation properties.
  - name: Unit Types
    description: Property-level rentable unit types that agents can later offer.
  - name: Agent Offers
    description: Agent-specific availability, pricing, and presentation for unit types.
  - name: Media
    description: >-
      Image uploads and media metadata for properties, unit types, and agent
      offers.
  - name: Agent Applications
    description: Signed-in agent applications and campus operator review.
  - name: Agent Lifecycle
    description: Campus-scoped operator suspension and reinstatement of agent profiles.
paths:
  /healthz:
    $ref: paths/healthz.yaml
  /v1/auth/google/start:
    $ref: paths/v1_auth_google_start.yaml
  /v1/auth/google/callback:
    $ref: paths/v1_auth_google_callback.yaml
  /v1/auth/session:
    $ref: paths/v1_auth_session.yaml
  /v1/auth/logout:
    $ref: paths/v1_auth_logout.yaml
  /v1/agent-applications:
    $ref: paths/v1_agent-applications.yaml
  /v1/operator/agent-applications:
    $ref: paths/v1_operator_agent-applications.yaml
  /v1/operator/agent-applications/{id}/activate:
    $ref: paths/v1_operator_agent-applications_{id}_activate.yaml
  /v1/operator/agent-applications/{id}/decline:
    $ref: paths/v1_operator_agent-applications_{id}_decline.yaml
  /v1/operator/agents/{id}/suspend:
    $ref: paths/v1_operator_agents_{id}_suspend.yaml
  /v1/operator/agents/{id}/reinstate:
    $ref: paths/v1_operator_agents_{id}_reinstate.yaml
  /v1/campuses/{slug}:
    $ref: paths/v1_campuses_{slug}.yaml
  /v1/discovery:
    $ref: paths/v1_discovery.yaml
  /v1/properties:
    $ref: paths/v1_properties.yaml
  /v1/properties/{id}:
    $ref: paths/v1_properties_{id}.yaml
  /v1/properties/{id}/unit-types:
    $ref: paths/v1_properties_{id}_unit-types.yaml
  /v1/unit-types/{id}/agent-offers:
    $ref: paths/v1_unit-types_{id}_agent-offers.yaml
  /v1/unit-types/{id}:
    $ref: paths/v1_unit-types_{id}.yaml
  /v1/media:
    $ref: paths/v1_media.yaml
