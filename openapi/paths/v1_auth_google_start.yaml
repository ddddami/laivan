get:
  operationId: startGoogleAuth
  tags:
    - Authentication
  summary: Start Google sign-in.
  description: >-
    Creates a short-lived signed OIDC attempt cookie and redirects the browser
    to Google.
  parameters:
    - name: return_to
      in: query
      required: false
      description: Relative in-app path to open after successful sign-in.
      schema:
        type: string
        pattern: '^/[^/].*|^/$'
  responses:
    '302':
      description: Redirect to Google sign-in.
      headers:
        Location:
          schema:
            type: string
            format: uri
        Set-Cookie:
          schema:
            type: string
    '429':
      $ref: ../components/responses/RateLimited.yaml
    '503':
      $ref: ../components/responses/AuthUnavailable.yaml
