post:
  operationId: uploadMedia
  tags:
    - Media
  summary: Upload media for a marketplace entity.
  description: >
    Uploads one or more image files for exactly one target: property, property
    unit type, or agent offer.

    Images are stored as originals and delivery variants are generated through
    Imgproxy URLs. Provenance is derived from the authenticated actor; an active
    agent may upload to canonical data in their campus or to their own offer,
    while operators and global admins may upload within their authorized scope.
  security:
    - sessionAuth: []
  parameters:
    - $ref: ../components/parameters/CSRFToken.yaml
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - files
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
              description: One or more JPEG, PNG, or WebP image files.
            property_id:
              type: string
              format: uuid
              description: Property target ID. Use exactly one target field.
            property_unit_type_id:
              type: string
              format: uuid
              description: Property unit type target ID. Use exactly one target field.
            agent_offer_id:
              type: string
              format: uuid
              description: Agent offer target ID. Use exactly one target field.
            caption:
              type: string
              maxLength: 500
  responses:
    '201':
      description: Media uploaded successfully.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaUploadResponse.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthenticated.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/ValidationFailed.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
