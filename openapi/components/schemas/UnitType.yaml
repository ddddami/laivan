type: object
required:
  - id
  - property_id
  - category
  - name
  - description
  - bedroom_count
  - has_parlour
  - bathroom_type
  - kitchen_type
  - version
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  category:
    $ref: ./UnitCategory.yaml
  name:
    type: string
  description:
    type: string
    description: Unit type description. May be empty when unavailable.
  notes:
    type:
      - string
      - 'null'
    maxLength: 2000
    description: >-
      Structural notes about the unit. Examples include "Kitchen is outside but
      private" or "Top floor corner unit."
  bedroom_count:
    type:
      - integer
      - 'null'
    minimum: 0
  has_parlour:
    type:
      - boolean
      - 'null'
  bathroom_type:
    anyOf:
      - $ref: ./BathroomType.yaml
      - type: 'null'
  kitchen_type:
    anyOf:
      - $ref: ./KitchenType.yaml
      - type: 'null'
  version:
    type: integer
    minimum: 1
    description: Current optimistic-concurrency version.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
