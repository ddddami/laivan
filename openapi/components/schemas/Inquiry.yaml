type: object
required:
  - id
  - agent_offer_id
  - message
  - status
  - created_at
properties:
  id:
    type: string
    format: uuid
  agent_offer_id:
    type: string
    format: uuid
  message:
    type: string
  status:
    type: string
    enum:
      - open
      - closed
  created_at:
    type: string
    format: date-time
