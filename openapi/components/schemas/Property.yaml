type: object
required:
  - id
  - campus_id
  - name
  - area
  - landmark
  - description
  - version
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  campus_id:
    type: string
    format: uuid
  name:
    type: string
  area:
    type: string
  landmark:
    type: string
    description: Approximate landmark. May be empty when unavailable.
  description:
    type: string
    description: Building-level notes. May be empty when unavailable.
  version:
    type: integer
    minimum: 1
    description: Current optimistic-concurrency version.
  thumbnail_url:
    type:
      - string
      - 'null'
    format: uri
    description: >-
      Imgproxy-generated thumbnail URL for the first available image, when
      present.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
