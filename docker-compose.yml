name: laivan

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laivan
      POSTGRES_PASSWORD: laivan
      POSTGRES_DB: laivan
    ports:
      - "5433:5432"
    volumes:
      - laivan_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laivan -d laivan"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: laivan
      MINIO_ROOT_PASSWORD: laivan123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - laivan_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 laivan laivan123 &&
      mc mb --ignore-existing local/laivan-dev &&
      mc anonymous set download local/laivan-dev
      "

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.3
    environment:
      IMGPROXY_KEY: 6c616976616e2d6465762d696d6770726f78792d6b65792d31323334
      IMGPROXY_SALT: 6c616976616e2d6465762d696d6770726f78792d73616c742d3132
      IMGPROXY_ALLOWED_SOURCES: http://localhost:9000/,http://minio:9000/
      IMGPROXY_MAX_SRC_FILE_SIZE: 10485760
      IMGPROXY_MAX_SRC_RESOLUTION: 40
    ports:
      - "8080:8080"

volumes:
  laivan_postgres_data:
  laivan_minio_data:
