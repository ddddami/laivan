services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laivan
      POSTGRES_PASSWORD: laivan
      POSTGRES_DB: laivan
    ports:
      - "5433:5432"
    volumes:
      - laivan_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laivan -d laivan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  laivan_postgres_data:
